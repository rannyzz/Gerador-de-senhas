<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>

    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body{
    background: #0f1120;
    color: white;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    height: 100vh;
    gap: 20px;
}

/* TÍTULO */
h1{
    font-size: 32px;
}

/* CAIXA DA SENHA */
#senha_gerada{
    width: 280px;
    background: #1b1d2e;
    padding: 15px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    word-break: break-all;
    border: none;
}

/* CARD */
.marcadores{
    background: #1b1d2e;
    padding: 20px;
    border-radius: 10px;
    width: 280px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* INPUT NUMBER */
input[type="number"]{
    width: 60px;
    padding: 6px;
    border-radius: 5px;
    border: none;
    outline: none;
}

/* LABELS */
label{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

/* BOTÃO */
button{
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #8cc63f;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover{
    transform: scale(1.03);
}
input[type="checkbox"]{
    accent-color: #8cc63f;
    cursor: pointer;
}
    </style>
</head>
<body>
    <h1>Gerador de Senha</h1>
    <p id="senha_gerada"></p>

    <div class="marcadores">
        <input type="number" id="tamanho_senha" placeholder="Tamanho da senha">

        <label>
            <input type="checkbox" id="maiuscula">
            Incluir letras maiúsculas
        </label>

        <label>
            <input type="checkbox" id="minuscula">
            Incluir letras minúsculas
        </label>

        <label>
            <input type="checkbox" id="numeros">
            Incluir números
        </label>

        <label>
            <input type="checkbox" id="simbolos">
            Incluir símbolos
        </label>

        <button id="gerar_senha" onclick="gerarSenha()">Gerar Senha</button>
    </div>

    <script>
        const tamanhosenha = document.getElementById('tamanho_senha');
        const checkboxMaiuscula = document.getElementById('maiuscula');
        const checkboxMinuscula = document.getElementById('minuscula');
        const checkboxNumeros = document.getElementById('numeros');
        const checkboxSimbolos = document.getElementById('simbolos');

        const maiuscula = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const minuscula = "abcdefghijklmnopqrstuvwxyz";
        const numeros = "0123456789";
        const simbolos = "!@#$%^&*";

        const camposenha = document.getElementById('senha_gerada');

        function gerarSenha() {
            let tamanho = parseInt(tamanhosenha.value);
            let caracteres = "";
            let senha = "";

            if (checkboxMaiuscula.checked) {
                caracteres += maiuscula;
            }

            if (checkboxMinuscula.checked) {
                caracteres += minuscula;
            }

            if (checkboxNumeros.checked) {
                caracteres += numeros;
            }

            if (checkboxSimbolos.checked) {
                caracteres += simbolos;
            }

            if (caracteres === "") {
                camposenha.innerText = "Selecione pelo menos um tipo de caractere.";
                return;
            }

            if (isNaN(tamanho) || tamanho <= 0) {
                camposenha.innerText = "Digite um tamanho válido.";
                return;
            }

            for (let i = 0; i < tamanho; i++) {
                let aleatorio = Math.floor(Math.random() * caracteres.length);
                senha += caracteres[aleatorio];
            }

            camposenha.innerText = senha;
        }
    </script>
</body>
</html>
